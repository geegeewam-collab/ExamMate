name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and test
        run: |
          npm run typecheck
          npm test

      - name: Show the build config files
        run: |
          echo "----- capacitor.config.ts"
          cat capacitor.config.ts || echo "capacitor.config.ts is MISSING"
          echo "----- next.config.js"
          cat next.config.js || echo "next.config.js is missing (the Android build does not need it)"

      - name: Build the web bundle and sync it into the Android project
        run: npm run cap:sync

      - name: Work out the version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v$VERSION"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Exam Mate $VERSION (build ${{ github.run_number }}) for tag $TAG"

      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Add the four ANDROID_ secrets in Settings, Secrets and variables, Actions, then run this workflow again."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/exammate.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/exammate.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx3g \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Collect the APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          cp "$APK" ExamMate.apk
          ls -lh ExamMate.apk
          BT="$(ls -d "${ANDROID_HOME:-/nonexistent}"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs ExamMate.apk || echo "::warning::apksigner could not verify the signature"
          else
            echo "::warning::apksigner not found, skipped the signature check"
          fi

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: ExamMate-apk
          path: ExamMate.apk
          if-no-files-found: error

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Exam Mate ${{ steps.ver.outputs.name }}"
          files: ExamMate.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
