# Builds the signed Android APK and attaches it to a GitHub Release.
#
# To publish a new version:   git tag v1.0.0   then   git push --tags
# The APK appears under Releases as ExamMate.apk.
# (Actions > "Build Android APK" > Run workflow builds an APK you can download from the run page, without a release.)
name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do
            if [ -z "${!v}" ]; then
              echo "::error::A signing secret is missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions. See the README."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu runners already include the Android SDK, so the old "android-actions/setup-android"
      # step (which crashed on "sdkmanager tools") is not needed. This only accepts licences and makes sure
      # the platform we compile against is present. It never fails the build: Gradle can fetch what is missing.
      - name: Prepare Android SDK
        continue-on-error: true
        run: |
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found; relying on the SDK already on the runner."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # One version number for everything: Gradle's versionName, the number the app shows in Settings > About, and the
      # number the update checker compares with the newest release. The Next.js build reads NEXT_PUBLIC_APP_VERSION
      # from the environment, so without this step the app would not know its own version and would never check.
      # Tags must be three numbers (v1.0.1). Anything else is refused here instead of shipping an app that cannot update.
      - name: Work out the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$V" | grep -Eq '^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$'; then
              echo "::error::The tag \"$GITHUB_REF_NAME\" is not a version like v1.0.1. Use three numbers (v1.0.1, v1.2.0, v2.0.0) so the app's update checker can compare versions."
              exit 1
            fi
          else
            V="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building Exam Mate $V"

      - name: Build the app bundle and sync it into Android
        env:
          # Your website. Override with a repository variable named APP_URL if it ever changes.
          NEXT_PUBLIC_API_URL: ${{ vars.APP_URL || 'https://exam-mate-one.vercel.app' }}
          NEXT_PUBLIC_SUPPORT_URL: ${{ vars.SUPPORT_URL }}
        run: node scripts/export.mjs

      - name: Decode and check keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-copy it from PowerShell and save the secret again."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KP" -alias "$KA" > /dev/null 2>&1 \
            || { echo "::error::The keystore opened badly. Check ANDROID_KEYSTORE_PASSWORD and that ANDROID_KEY_ALIAS is exactly: exammate"; exit 1; }

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PappVersionCode="${GITHUB_RUN_NUMBER}" -PappVersionName="$APP_VERSION"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ExamMate.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: ExamMate-apk
          path: ExamMate.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ExamMate.apk
          tag_name: ${{ github.ref_name }}
          name: Exam Mate ${{ github.ref_name }}
          generate_release_notes: true
          # Optional: keep the code repo private and publish downloads in a separate PUBLIC repo.
          # Set repository variable RELEASES_REPO (e.g. yourname/exammate-downloads) and secret RELEASES_TOKEN.
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
