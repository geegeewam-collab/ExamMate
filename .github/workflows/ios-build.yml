name: Validate iOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and sync native iOS project
        env:
          NEXT_PUBLIC_API_URL: https://exam-mate-one.vercel.app
        run: npm run cap:sync:ios

      - name: Build for iOS Simulator
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            PROJECT_ARGS=(-workspace App.xcworkspace)
          else
            PROJECT_ARGS=(-project App.xcodeproj)
          fi
          xcodebuild "${PROJECT_ARGS[@]}" \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
