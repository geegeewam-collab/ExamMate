
# Exam Mate - Android Release Workflow
name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing Android signing secret: $v"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and sync Exam Mate
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.APP_URL || 'https://exam-mate-one.vercel.app' }}
          NEXT_PUBLIC_SUPPORT_URL: ${{ vars.SUPPORT_URL }}
        run: node scripts/export.mjs

      - name: Decode Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi

          chmod +x ./gradlew

          ./gradlew assembleRelease \
            -PappVersionCode="${GITHUB_RUN_NUMBER}" \
            -PappVersionName="$VERSION"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ExamMate.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamMate-APK
          path: ExamMate.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ExamMate.apk
          tag_name: ${{ github.ref_name }}
          name: Exam Mate ${{ github.ref_name }}
          generate_release_notes: true
